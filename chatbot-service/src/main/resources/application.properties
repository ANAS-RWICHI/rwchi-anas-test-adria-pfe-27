spring.application.name=chatbot-service
server.port=8084

# Gemini (Google GenAI) - the key is read from the GEMINI_API_KEY environment variable, never committed
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=0.2
spring.ai.model.image=none
spring.ai.model.embedding.text=none

# MCP client: tools exposed by the business microservices (Streamable HTTP on /mcp)
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.name=bank-chatbot
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.account-service.url=${ACCOUNT_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=${TRANSACTION_MCP_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info
