spring.application.name=transaction-service
server.port=8082
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:h2:mem:transactions-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Served by config-service; the default only applies when the config server is down
bank.transaction.max-amount=${MAX_AMOUNT:1000}

# OpenFeign + Resilience4j circuit breaker on AccountRestClient
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.timelimiter.configs.default.timeout-duration=4s
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException$FeignClientException
# Retry on account reads only (TransactionService.fetchAccount)
resilience4j.retry.instances.account-service.max-attempts=3
resilience4j.retry.instances.account-service.wait-duration=500ms
resilience4j.retry.instances.account-service.retry-exceptions=org.example.transactionservice.service.exception.AccountServiceUnavailableException

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}

spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
management.endpoints.web.exposure.include=health,info,env,refresh,circuitbreakers,retries,retryevents,circuitbreakerevents
