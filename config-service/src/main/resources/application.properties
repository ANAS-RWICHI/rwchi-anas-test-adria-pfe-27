spring.application.name=config-service
server.port=8888
spring.profiles.active=native
# Packaged repo by default; set CONFIG_REPO_LOCATION=file:/path/to/config-repo to edit values without rebuilding
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_LOCATION:classpath:/config-repo}
management.endpoints.web.exposure.include=health,info,refresh
